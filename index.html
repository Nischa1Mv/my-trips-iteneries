<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9EDE6;
    --ink:#18231D;
    --ink-soft:#4E5C53;
    --forest:#2F5A43;
    --laterite:#94371F;
    --rule:#C5CEBF;
    --shade:#D6DED0;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121814;
      --ink:#E6EBE3;
      --ink-soft:#9DAAA1;
      --forest:#85BD98;
      --laterite:#E08966;
      --rule:#2B3730;
      --shade:#1F2922;
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Public Sans","Segoe UI",Helvetica,Arial,sans-serif;
    font-size:16.5px;
    line-height:1.62;
  }
  .wrap{max-width:38rem;margin:0 auto;padding:2.2rem 1.25rem 5rem}
  h1{font-family:Archivo,"Public Sans",Helvetica,Arial,sans-serif;font-weight:700;font-size:1.9rem;margin:0 0 .3rem}
  .lede{color:var(--ink-soft);font-size:1.02rem;margin:0 0 1.8rem;max-width:34rem}
  ul{list-style:none;margin:0;padding:0}
  li+li{margin-top:.8rem}
  a.trip{
    display:block;
    padding:1rem 1.1rem;
    border:1px solid var(--rule);
    border-radius:.6rem;
    background:var(--shade);
    text-decoration:none;
    color:var(--ink);
  }
  a.trip:hover{border-color:var(--forest)}
  .trip strong{font-family:Archivo,"Public Sans",Helvetica,Arial,sans-serif;font-weight:600;font-size:1.08rem;display:block}
  .trip span{color:var(--ink-soft);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trip notes</h1>
  <p class="lede">Itineraries, kept here so they don't get lost in a chat thread.</p>
  <ul>
    <li>
      <a class="trip" href="deomali.html">
        <strong>Vizag → Deomali</strong>
        <span>Two-day motorcycle run to Odisha's highest peak, via Araku and Balda, back on NH26</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
